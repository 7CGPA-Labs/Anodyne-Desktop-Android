<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Files | Anodyne File Viewer</title>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #242424;
            color: #ffffff;
            font-family: Cantarell, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .files-app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Sidebar Styling - Gnome Nautilus Style */
        .files-sidebar {
            width: 240px;
            background-color: #1e1e1e;
            border-right: 1px solid #1c1c1c;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .section-title {
            font-size: 0.7rem;
            color: #8a8a93;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            margin-left: 12px;
            font-weight: 700;
        }

        .drive-list {
            list-style: none;
            margin-bottom: 24px;
        }

        .drive-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 3px;
            transition: background-color 0.1s, color 0.1s;
            color: #e2e8f0;
        }

        .drive-list li:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        .drive-list li.active {
            background-color: #3584e4;
            color: #ffffff;
        }

        .drive-list li .icon {
            font-size: 1.1rem;
        }

        .drive-list li .label {
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Main Explorer Pane - Gnome Nautilus Style */
        .files-main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: #242424;
        }

        .explorer-header {
            height: 56px;
            border-bottom: 1px solid #1c1c1c;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background-color: #303030;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.1rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.15s;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .header-action-btn {
            background: transparent;
            border: none;
            color: #e2e8f0;
            font-size: 1rem;
            cursor: pointer;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background-color 0.15s, color 0.15s;
        }

        .header-action-btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .header-action-btn.active {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        /* Breadcrumbs (Nautilus style segment cards) */
        .nautilus-breadcrumbs {
            display: flex;
            align-items: center;
            gap: 4px;
            background-color: #1e1e1e;
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid #1c1c1c;
            font-size: 0.8rem;
        }

        .breadcrumb-item {
            cursor: pointer;
            color: #cbd5e1;
            font-weight: 500;
        }

        .breadcrumb-item:hover {
            color: #ffffff;
        }

        .breadcrumb-separator {
            color: #64748b;
            font-size: 0.75rem;
        }

        .breadcrumb-item.active {
            color: #ffffff;
            font-weight: 600;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.15s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: #3584e4;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #1c71d8;
        }

        /* Nautilus Grid Explorer layout */
        .explorer-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 16px;
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 14px 10px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.12s, border-color 0.12s;
            border: 1px solid transparent;
        }

        .grid-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .grid-item.selected {
            background-color: #3584e4;
            border-color: #1c71d8;
        }

        .grid-item.selected .item-name {
            color: #ffffff;
            background-color: #1c71d8;
            border-radius: 4px;
            padding: 1px 6px;
        }

        .item-icon {
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 64px;
            height: 64px;
        }

        .item-name {
            font-size: 0.8rem;
            color: #e2e8f0;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
            padding: 2px 4px;
        }

        /* Footer Status Bar for Telemetry */
        .files-footer {
            background-color: #303030;
            border-top: 1px solid #1c1c1c;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .footer-job-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .job-lbl {
            font-size: 0.85rem;
            font-weight: 600;
            color: #e0e0e0;
        }

        .job-id {
            font-family: monospace;
            font-size: 0.8rem;
            color: #808080;
        }

        .footer-progress-track {
            background-color: #1e1e1e;
            height: 8px;
            border-radius: 4px;
            width: 100%;
            overflow: hidden;
        }

        .footer-progress-fill {
            background-color: #3584e4;
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: width 0.3s ease-out;
        }

        .footer-status-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #f6d32d;
            font-weight: 600;
        }

        #footer-status-msg {
            color: #a0a0a0;
            font-weight: 500;
        }

        .hidden {
            display: none !important;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .btn-secondary {
            background-color: #3a3a3a;
            color: #ffffff;
            border: 1px solid #4a4a4a;
        }

        .btn-secondary:hover {
            background-color: #454545;
        }

        .btn-danger {
            background-color: #e01b24;
            color: #ffffff;
        }

        .btn-danger:hover {
            background-color: #c01c28;
        }

        /* File Details & Analysis Sidebar */
        .details-sidebar {
            width: 300px;
            background-color: #1e1e1e;
            border-left: 1px solid #1c1c1c;
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .details-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.01);
            transition: background-color 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .details-empty-state.dragover {
            background-color: rgba(53, 132, 228, 0.08);
            border-color: #3584e4;
        }

        .drop-icon {
            font-size: 2.5rem;
            color: #3584e4;
            margin-bottom: 12px;
            animation: pulse-glow 2s infinite alternate;
        }

        .drop-label {
            font-size: 0.82rem;
            color: #8a8a93;
            line-height: 1.4;
        }

        .details-active-state {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .details-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .detail-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-label {
            font-size: 0.72rem;
            color: #8a8a93;
            text-transform: uppercase;
            font-weight: 700;
        }

        .detail-value {
            font-size: 0.88rem;
            color: #ffffff;
            font-weight: 500;
            word-break: break-all;
        }



        @keyframes pulse-glow {
            0% {
                transform: scale(1);
                text-shadow: 0 0 10px rgba(53, 132, 228, 0.3);
            }
            100% {
                transform: scale(1.05);
                text-shadow: 0 0 20px rgba(53, 132, 228, 0.6);
            }
        }
    </style>
</head>
<body>
    <div class="files-app-container">
        <!-- Sidebar Navigation (GNOME Nautilus Style) -->
        <aside class="files-sidebar">
            <div class="section-title">Places</div>
            <ul class="drive-list">
                <li id="sb-user-home" onclick="switchDirectory('user-home')">
                    <span class="icon">🏠</span>
                    <span class="label">Home</span>
                </li>
                <li id="sb-system-root" class="active" onclick="switchDirectory('system-root')">
                    <span class="icon">🖥️</span>
                    <span class="label">System Root (/)</span>
                </li>
            </ul>

            <div class="section-title">Devices</div>
            <ul class="drive-list">
                <li id="sb-external-usb" onclick="switchDirectory('external-usb')">
                    <span class="icon">🔌</span>
                    <span class="label">External USB</span>
                </li>
            </ul>

            <div class="section-title">Trash</div>
            <ul class="drive-list">
                <li id="sb-recycle-bin" onclick="switchDirectory('recycle-bin')">
                    <span class="icon">🗑️</span>
                    <span class="label">Trash</span>
                </li>
            </ul>
        </aside>

        <!-- Main Explorer Area -->
        <main class="files-main">
            <!-- Nautilus Header Bar -->
            <header class="explorer-header">
                <div class="header-left">
                    <button class="nav-btn" onclick="historyBack()" id="btn-back" title="Go Back">🡰</button>
                    <button class="nav-btn" onclick="historyForward()" id="btn-forward" title="Go Forward">🡲</button>
                    <div class="nautilus-breadcrumbs" id="nautilus-breadcrumbs">
                        <!-- Populated dynamically via JS -->
                    </div>
                </div>
                <div class="header-right">
                    <button class="header-action-btn" title="Search files">🔍</button>
                    <button class="header-action-btn active" title="Grid view">▤</button>
                    <button class="header-action-btn" title="View options">☰</button>
                    <button class="btn btn-primary" onclick="triggerBackupJob()">
                        <span class="btn-icon">📁</span> Backup to USB
                    </button>
                </div>
            </header>

            <!-- File Grid Content Pane -->
            <section class="explorer-content">
                <div class="files-grid" id="files-grid">
                    <!-- Populated dynamically via JS -->
                </div>
            </section>

            <!-- Task Telemetry Footer -->
            <footer id="files-telemetry-footer" class="files-footer hidden">
                <div class="footer-job-details">
                    <span class="job-lbl">Async System Copy Job</span>
                    <span id="footer-job-id" class="job-id">ID: ----</span>
                </div>
                <div class="footer-progress-track">
                    <div id="footer-progress-fill" class="footer-progress-fill" style="width: 0%"></div>
                </div>
                <div class="footer-status-row" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <div>
                        <span id="footer-percentage-text">0% Completed</span>
                        <span id="footer-status-msg" style="margin-left: 10px;">Executing File Worker...</span>
                    </div>
                    <div class="job-controls">
                        <button id="btn-pause" class="btn btn-secondary btn-sm" onclick="controlJob('pause')">Pause</button>
                        <button id="btn-resume" class="btn btn-secondary btn-sm hidden" onclick="controlJob('resume')">Resume</button>
                        <button id="btn-cancel" class="btn btn-danger btn-sm" onclick="controlJob('cancel')">Cancel</button>
                    </div>
                </div>
            </footer>
        </main>

        <!-- File Details & Analysis Sidebar -->
        <aside class="details-sidebar" id="details-sidebar">
            <div class="section-title">Properties</div>
            
            <!-- Empty State / Dropzone -->
            <div id="details-empty-state" class="details-empty-state">
                <div class="drop-icon">📁</div>
                <p class="drop-label">Select a file from the explorer grid or drag a local file here to analyze metrics.</p>
            </div>

            <!-- Details Content -->
            <div id="details-active-state" class="details-active-state hidden">
                <div class="details-card">
                    <div class="detail-row">
                        <span class="detail-label">Name:</span>
                        <span id="detail-name" class="detail-value">--</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Type:</span>
                        <span id="detail-type" class="detail-value">--</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Size:</span>
                        <span id="detail-size" class="detail-value">--</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Permissions:</span>
                        <span id="detail-perms" class="detail-value"><code>--</code></span>
                    </div>
                </div>


            </div>
        </aside>
    </div>

    <script>
        let selectedFileData = null;
        let selectedFileName = "";
        let currentDirectoryKey = "";

        // Navigation history
        let navigationHistory = [];
        let historyIndex = -1;

        (function() {
            var messagePort = null;
            var pendingRequests = [];
            var callbackMap = {};

            window.addEventListener('message', function(e) {
                if (e.data === 'init-ipc' && e.ports && e.ports.length > 0) {
                    messagePort = e.ports[0];
                    messagePort.onmessage = function(event) {
                        // Secure WebMessagePort messages
                    };
                    
                    while (pendingRequests.length > 0) {
                        var req = pendingRequests.shift();
                        messagePort.postMessage(JSON.stringify(req));
                    }
                }
            });

            window.addEventListener('anodyneIpcResponse', function(e) {
                var detail = e.detail;
                if (detail && callbackMap[detail.id]) {
                    callbackMap[detail.id](detail.result);
                    delete callbackMap[detail.id];
                }
            });

            window.anodyneIPC = {
                send: function(action) {
                    var args = Array.prototype.slice.call(arguments, 1);
                    var id = 'msg_' + Math.random().toString(36).substr(2, 9);
                    return new Promise(function(resolve) {
                        callbackMap[id] = resolve;
                        var req = { id: id, action: action, args: args };
                        if (messagePort) {
                            messagePort.postMessage(JSON.stringify(req));
                        } else {
                            pendingRequests.push(req);
                        }
                    });
                }
            };
        })();

        document.addEventListener("DOMContentLoaded", function() {
            initializeAnodyneIPCBridge();
            initializeDragAndDrop();
            // Default to system root view
            navigateTo('system-root');
        });

        let activeJobId = "";

        // 1. Host QWebChannel Synchronization
        function initializeAnodyneIPCBridge() {
            window.anodyneIPC.send("logWebEvent", "Files PWA: WebMessagePort bridge synchronized.");
            
            window.onNativeJobProgressChanged = function(jobId, progress) {
                if (activeJobId !== jobId) {
                    activeJobId = jobId;
                    document.getElementById("btn-pause").classList.remove("hidden");
                    document.getElementById("btn-resume").classList.add("hidden");
                }
                updateFooterTaskBar(jobId, progress);
            };
            
            window.onNativeJobFinished = function(jobId, success, message) {
                completeFooterTaskBar(jobId, success, message);
            };
        }

        // 2. Directory Navigation Engine (Mocking namespaces)
        const fileSystemData = {
            'system-root': {
                name: 'Other Locations',
                path: '/',
                items: [
                    { name: 'bin', type: 'Directory', size: '--', perms: 'drwxr-xr-x' },
                    { name: 'boot', type: 'Directory', size: '--', perms: 'drwxr-xr-x' },
                    { name: 'etc', type: 'Directory', size: '--', perms: 'drwxr-xr-x' },
                    { name: 'lib', type: 'Directory', size: '--', perms: 'drwxr-xr-x' },
                    { name: 'var', type: 'Directory', size: '--', perms: 'drwxr-xr-x' },
                    { name: 'initrd.img', type: 'File', size: '28.4 MB', perms: '-rw-r--r--' },
                    { name: 'vmlinuz', type: 'File', size: '8.2 MB', perms: '-rw-r--r--' }
                ]
            },
            'user-home': {
                name: 'Home',
                path: '/home/user',
                items: [
                    { name: 'Downloads', type: 'Directory', size: '--', perms: 'drwxr-xr-x' },
                    { name: 'Documents', type: 'Directory', size: '--', perms: 'drwxr-xr-x' },
                    { name: 'Pictures', type: 'Directory', size: '--', perms: 'drwxr-xr-x' },
                    { name: '.config', type: 'Directory', size: '--', perms: 'drwx------' },
                    { name: 'welcome.txt', type: 'File', size: '1.2 KB', perms: '-rw-r--r--' }
                ]
            },
            'external-usb': {
                name: 'External USB',
                path: '/media/usb/backup',
                items: [
                    { name: 'SystemBackup_2026.tar.gz', type: 'Compressed Archive', size: '142.6 MB', perms: '-rw-r--r--' }
                ]
            },
            'recycle-bin': {
                name: 'Trash',
                path: '/root/.recycle_bin',
                items: [
                    { name: 'old_kernel_config.bak', type: 'Backup File', size: '12 KB', perms: '-rw-r--r--' }
                ]
            }
        };

        function navigateTo(key) {
            if (!fileSystemData[key]) return;
            
            // Add to history
            if (historyIndex === -1 || navigationHistory[historyIndex] !== key) {
                navigationHistory = navigationHistory.slice(0, historyIndex + 1);
                navigationHistory.push(key);
                historyIndex = navigationHistory.length - 1;
            }
            
            switchDirectory(key);
        }

        function historyBack() {
            if (historyIndex > 0) {
                historyIndex--;
                switchDirectory(navigationHistory[historyIndex]);
            }
        }

        function historyForward() {
            if (historyIndex < navigationHistory.length - 1) {
                historyIndex++;
                switchDirectory(navigationHistory[historyIndex]);
            }
        }

        function updateHistoryButtons() {
            const backBtn = document.getElementById("btn-back");
            const forwardBtn = document.getElementById("btn-forward");
            
            if (backBtn) backBtn.style.opacity = (historyIndex > 0) ? "1" : "0.4";
            if (forwardBtn) forwardBtn.style.opacity = (historyIndex < navigationHistory.length - 1) ? "1" : "0.4";
        }

        function switchDirectory(key) {
            currentDirectoryKey = key;
            const data = fileSystemData[key];
            if (!data) return;

            updateHistoryButtons();

            // Update Sidebar visual highlights
            const listItems = document.querySelectorAll(".files-sidebar li");
            listItems.forEach(li => li.classList.remove("active"));
            
            const activeItem = document.getElementById("sb-" + key);
            if (activeItem) {
                activeItem.classList.add("active");
            }

            // Draw Breadcrumbs
            buildBreadcrumbs(data.path, key);

            // Populate file grid
            const grid = document.getElementById("files-grid");
            grid.innerHTML = "";

            data.items.forEach(item => {
                const itemEl = document.createElement("div");
                itemEl.className = "grid-item";
                
                if (item.type === 'Directory') {
                    itemEl.ondblclick = function() {
                        // Nautilus double click navigation simulation
                    };
                }
                
                itemEl.onclick = function() {
                    document.querySelectorAll(".grid-item").forEach(el => el.classList.remove("selected"));
                    itemEl.classList.add("selected");
                    selectVirtualFile(item.name, item.type, item.size, item.perms);
                };
                
                // Clean vector icon drawings
                const iconHtml = item.type === 'Directory' ? `
                    <svg width="48" height="48" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M6 10C6 7.79086 7.79086 6 10 6H24L30 14H54C56.2091 14 58 15.7909 58 18V50C58 52.2091 56.2091 54 54 54H10C7.79086 54 6 52.2091 6 50V10Z" fill="#3584e4"/>
                      <path d="M6 18C6 15.7909 7.79086 14 10 14H54C56.2091 14 58 15.7909 58 18V50C58 52.2091 56.2091 54 54 54H10C7.79086 54 6 52.2091 6 50V18Z" fill="#62a0ea"/>
                      <path d="M10 14H54C55.1046 14 56 14.8954 56 16V18H8V16C8 14.8954 8.89543 14 10 14Z" fill="#1c71d8" opacity="0.3"/>
                    </svg>
                ` : `
                    <svg width="48" height="48" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M12 6C12 3.79086 13.7909 2 16 2H40L52 14V58C52 60.2091 50.2091 62 48 62H16C13.7909 62 12 60.2091 12 58V6Z" fill="#e2e8f0"/>
                      <path d="M40 2V14H52L40 2Z" fill="#cbd5e1"/>
                      <rect x="20" y="24" width="24" height="2" rx="1" fill="#94a3b8"/>
                      <rect x="20" y="32" width="24" height="2" rx="1" fill="#94a3b8"/>
                      <rect x="20" y="40" width="16" height="2" rx="1" fill="#94a3b8"/>
                    </svg>
                `;

                itemEl.innerHTML = `
                    <div class="item-icon">${iconHtml}</div>
                    <div class="item-name" title="${item.name}">${item.name}</div>
                `;
                grid.appendChild(itemEl);
            });
        }

        function buildBreadcrumbs(path, key) {
            const breadcrumbBox = document.getElementById("nautilus-breadcrumbs");
            if (!breadcrumbBox) return;

            breadcrumbBox.innerHTML = "";
            const segments = path.split('/').filter(s => s.length > 0);
            
            // Root Segment
            const rootItem = document.createElement("span");
            rootItem.className = "breadcrumb-item" + (segments.length === 0 ? " active" : "");
            rootItem.textContent = key === "system-root" ? "Computer" : "Home";
            rootItem.onclick = () => navigateTo(key);
            breadcrumbBox.appendChild(rootItem);

            segments.forEach((seg, idx) => {
                const sep = document.createElement("span");
                sep.className = "breadcrumb-separator";
                sep.textContent = " › ";
                breadcrumbBox.appendChild(sep);

                const item = document.createElement("span");
                const isActive = (idx === segments.length - 1);
                item.className = "breadcrumb-item" + (isActive ? " active" : "");
                item.textContent = seg;
                breadcrumbBox.appendChild(item);
            });
        }

        function controlJob(action) {
            window.anodyneIPC.send("jobControl", activeJobId, action);
            if (action === 'pause') {
                document.getElementById("btn-pause").classList.add("hidden");
                document.getElementById("btn-resume").classList.remove("hidden");
                document.getElementById("footer-status-msg").textContent = "Job paused.";
            } else if (action === 'resume') {
                document.getElementById("btn-resume").classList.add("hidden");
                document.getElementById("btn-pause").classList.remove("hidden");
                document.getElementById("footer-status-msg").textContent = "Writing file blocks asynchronously...";
            } else if (action === 'cancel') {
                document.getElementById("footer-status-msg").textContent = "Canceling job...";
            }
        }

        function triggerBackupJob() {
            window.anodyneIPC.send("executeSystemCommand", "files");
        }

        function updateFooterTaskBar(jobId, progress) {
            const footer = document.getElementById("files-telemetry-footer");
            footer.classList.remove("hidden");

            document.getElementById("footer-job-id").textContent = "ID: " + jobId;
            document.getElementById("footer-percentage-text").textContent = progress + "% Completed";
            document.getElementById("footer-progress-fill").style.width = progress + "%";
            document.getElementById("footer-status-msg").textContent = "Writing file blocks asynchronously...";
        }

        function completeFooterTaskBar(jobId, success, message) {
            document.getElementById("footer-percentage-text").textContent = success ? "✓ Finished" : "✗ Failed";
            document.getElementById("footer-status-msg").textContent = message;
            
            const progressFill = document.getElementById("footer-progress-fill");
            progressFill.style.width = "100%";
            progressFill.style.backgroundColor = success ? "#4caf50" : "#f44336";

            setTimeout(function() {
                document.getElementById("files-telemetry-footer").classList.add("hidden");
                progressFill.style.width = "0%";
                progressFill.style.backgroundColor = "#007acc";
                activeJobId = "";
            }, 3000);
        }



        function selectVirtualFile(name, type, size, perms) {
            document.getElementById("details-empty-state").classList.add("hidden");
            document.getElementById("details-active-state").classList.remove("hidden");
            
            document.getElementById("detail-name").textContent = name;
            document.getElementById("detail-type").textContent = type;
            document.getElementById("detail-size").textContent = size;
            document.getElementById("detail-perms").firstElementChild.textContent = perms;
        }

        function initializeDragAndDrop() {
            const dropzone = document.getElementById("details-sidebar");
            const emptyState = document.getElementById("details-empty-state");
            if (!dropzone) return;
            
            ['dragenter', 'dragover'].forEach(eventName => {
                dropzone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    emptyState.classList.add("dragover");
                }, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropzone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    emptyState.classList.remove("dragover");
                }, false);
            });
            
            dropzone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                if (files.length > 0) {
                    handleDroppedFile(files[0]);
                }
            }, false);
        }

        function handleDroppedFile(file) {
            document.getElementById("details-empty-state").classList.add("hidden");
            document.getElementById("details-active-state").classList.remove("hidden");
            
            document.getElementById("detail-name").textContent = file.name;
            document.getElementById("detail-type").textContent = file.type || "Local File";
            
            let sizeStr = "";
            if (file.size < 1024) sizeStr = file.size + " B";
            else if (file.size < 1024 * 1024) sizeStr = (file.size / 1024).toFixed(1) + " KB";
            else sizeStr = (file.size / (1024 * 1024)).toFixed(1) + " MB";
            
            document.getElementById("detail-size").textContent = sizeStr;
            document.getElementById("detail-perms").firstElementChild.textContent = "-rw-r--r-- (local)";
        }
    </script>
</body>
</html>
