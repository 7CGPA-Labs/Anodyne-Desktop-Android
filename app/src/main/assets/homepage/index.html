<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url('momentum_bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Semi-transparent overlay to ensure contrast */
        .momentum-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1;
        }

        .homepage-container {
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            z-index: 2;
            padding: 24px;
        }

        /* Corner widgets layout */
        .corner {
            position: absolute;
            z-index: 10;
        }

        .top-left {
            top: 24px;
            left: 24px;
        }

        .top-right {
            top: 24px;
            right: 24px;
        }

        .bottom-left {
            bottom: 24px;
            left: 24px;
        }

        .bottom-right {
            bottom: 24px;
            right: 24px;
        }

        /* Glassmorphic Panel Styles */
        .translucent-panel {
            background: rgba(22, 22, 22, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            margin-top: 8px;
            min-width: 240px;
        }

        .bottom-left .translucent-panel,
        .bottom-right .translucent-panel {
            margin-top: 0;
            margin-bottom: 8px;
            position: absolute;
            bottom: 40px;
        }

        .bottom-left .translucent-panel { left: 0; }
        .bottom-right .translucent-panel { right: 0; }

        .panel-header {
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        /* Widgets toggle buttons */
        .widget-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .widget-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Central Content Panel */
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto;
            text-align: center;
            z-index: 5;
        }

        #live-clock {
            font-size: 8rem;
            font-weight: 200;
            letter-spacing: -4px;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            user-select: none;
        }

        #user-greeting {
            font-size: 2.2rem;
            font-weight: 500;
            margin-top: 10px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            letter-spacing: -0.5px;
        }

        /* Search bar and dropdown engine */
        .search-container {
            margin-top: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .search-box {
            display: flex;
            align-items: center;
            width: 480px;
            background: rgba(22, 22, 22, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 4px 6px 4px 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .search-box input[type="text"] {
            flex: 65;
            width: 65%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 1rem;
            padding: 8px 0;
        }

        .search-box input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-box select {
            flex: 35;
            width: 35%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: right;
            padding-right: 12px;
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            background-color: transparent;
        }

        .search-box select option {
            background-color: #161622;
            color: #ffffff;
        }

        .search-go-btn {
            background: #3584e4;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 1rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
            margin-left: 8px;
        }

        .search-go-btn:hover {
            background: #4a90e2;
            transform: scale(1.05);
        }

        .search-go-btn:active {
            transform: scale(0.95);
        }

        /* Quotes */
        .bottom-center-quote {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 80%;
            max-width: 600px;
            z-index: 5;
        }

        #quote-text {
            font-size: 0.85rem;
            font-style: italic;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }

        /* System Stat Widget */
        .system-stat-widget {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Launcher Grid inside Panel */
        .launcher-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            min-width: 90px;
        }

        .app-card:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #3584e4;
        }

        .app-card .icon {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .app-card .label {
            font-size: 0.75rem;
            color: #ffffff;
            font-weight: 600;
        }

        /* Background Jobs Box in Panel */
        .empty-state {
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
            font-size: 0.8rem;
            text-align: center;
            padding: 12px 0;
        }

        .task-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            margin-top: 4px;
            min-width: 200px;
        }

        .task-details {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        #task-title { font-weight: 600; color: #ffffff; }
        #task-id { color: rgba(255, 255, 255, 0.4); font-family: monospace; }

        .progress-track {
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            background-color: #3584e4;
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: width 0.3s ease-out;
        }

        .task-status-row {
            font-size: 0.75rem;
            color: #f6d32d;
            font-weight: 600;
        }

        /* RSS List */
        .rss-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            min-width: 260px;
        }

        .rss-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .rss-item:hover {
            border-color: #3584e4;
            background: rgba(255, 255, 255, 0.1);
        }

        .rss-item .rss-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .rss-item .rss-desc {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.3;
        }

        /* GPS Location Widget styling */
        .gps-location {
            background: rgba(22, 22, 22, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            font-size: 0.8rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .gps-logo {
            color: #ef4444;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="momentum-overlay"></div>

    <div class="homepage-container">
        <!-- Top Left: Minimal Launcher Widget -->
        <div class="corner top-left"></div>

        <!-- Top Right: GPS Location Widget -->
        <div class="corner top-right">
            <div id="gps-location-container" class="gps-location">
                <span class="gps-logo">📍 GPS</span>
                <span id="gps-place-text">Locating...</span>
            </div>
        </div>

        <!-- Center: Clock, Greeting & Main Search Bar -->
        <div class="center-content">
            <h1 id="live-clock">00:00</h1>
            <h2 id="user-greeting">Good day, Gagan.</h2>
            
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="dashboard-search-input" placeholder="Search the web...">
                    <select id="search-engine-select">
                        <option value="google">Google</option>
                        <option value="bing">Bing</option>
                        <option value="duckduckgo">DuckDuckGo</option>
                        <option value="wikipedia">Wikipedia</option>
                    </select>
                    <button class="search-go-btn" onclick="triggerWebSearch()">➔</button>
                </div>
            </div>
        </div>

        <!-- Bottom Left: RSS News Feed Widget -->
        <div class="corner bottom-left">
            <button class="widget-btn" onclick="toggleWidget('rss-panel')">📰 Developer Feed</button>
            <div id="rss-panel" class="translucent-panel hidden">
                <div class="panel-header">Anodyne OS News</div>
                <div id="rss-items-list" class="rss-list">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>
        </div>

        <!-- Bottom Center: Beautiful Rotating Quote -->
        <div class="bottom-center-quote">
            <p id="quote-text">"Focus on being productive instead of busy."</p>
        </div>

        <!-- Bottom Right: Background Operations Monitor -->
        <div class="corner bottom-right">
            <button class="widget-btn" id="btn-tasks-widget" onclick="toggleWidget('task-panel')">⚙️ Tasks</button>
            <div id="task-panel" class="translucent-panel hidden">
                <div class="panel-header">Background Jobs</div>
                <div id="no-tasks-msg" class="empty-state">No active background operations.</div>
                
                <div id="active-task-container" class="task-box hidden">
                    <div class="task-details">
                        <span id="task-title">File Copy</span>
                        <span id="task-id">ID: ----</span>
                    </div>
                    <div class="progress-track">
                        <div id="task-progress-fill" class="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="task-status-row">
                        <span id="task-percentage">0% Completed</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            initializeWallpaper();
            initializeClock();
            initializeAnodyneIPCBridge();
            initializeQuote();
            renderRssFeed();

            // Bind Enter key on search input
            const queryInput = document.getElementById("dashboard-search-input");
            if (queryInput) {
                queryInput.addEventListener("keydown", function(event) {
                    if (event.key === "Enter") {
                        triggerWebSearch();
                    }
                });
            }
        });

        // 1. Wallpaper cycling engine (day-to-day)
        function initializeWallpaper() {
            const wallpapers = [
                "https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?auto=format&fit=crop&w=1920&q=80",
                "https://images.unsplash.com/photo-1475274047050-1d0c0975c63e?auto=format&fit=crop&w=1920&q=80",
                "https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=1920&q=80",
                "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80",
                "https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1920&q=80",
                "https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?auto=format&fit=crop&w=1920&q=80",
                "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1920&q=80"
            ];

            const gradients = [
                "linear-gradient(135deg, #09090e 0%, #131324 100%)",
                "linear-gradient(135deg, #020617 0%, #0f172a 100%)",
                "linear-gradient(135deg, #050510 0%, #1e1b4b 100%)",
                "linear-gradient(135deg, #090509 0%, #2e1065 100%)",
                "linear-gradient(135deg, #022c22 0%, #064e3b 100%)",
                "linear-gradient(135deg, #0f172a 0%, #1e293b 100%)",
                "linear-gradient(135deg, #18000a 0%, #3b0764 100%)"
            ];

            const dayOfMonth = new Date().getDate();
            const wpIndex = dayOfMonth % wallpapers.length;

            if (navigator.onLine) {
                document.body.style.backgroundImage = `url('${wallpapers[wpIndex]}')`;
            } else {
                document.body.style.backgroundImage = gradients[wpIndex];
            }
        }

        // 2. Live Clock & Greeting
        function initializeClock() {
            const clockElement = document.getElementById("live-clock");
            const greetingElement = document.getElementById("user-greeting");

            function updateTime() {
                const now = new Date();
                let hours = now.getHours();
                let minutes = now.getMinutes();
                if (minutes < 10) minutes = "0" + minutes;
                
                clockElement.textContent = hours + ":" + minutes;
                
                if (hours < 12) greetingElement.textContent = "Good morning, Gagan.";
                else if (hours < 17) greetingElement.textContent = "Good afternoon, Gagan.";
                else greetingElement.textContent = "Good evening, Gagan.";
            }
            
            updateTime();
            setInterval(updateTime, 1000);
        }

        // 3. Web search trigger engine
        function triggerWebSearch() {
            const queryInput = document.getElementById("dashboard-search-input");
            const engineSelect = document.getElementById("search-engine-select");
            const query = queryInput.value.trim();
            if (!query) return;

            const engine = engineSelect.value;
            let url = "";
            if (engine === "google") {
                url = "https://www.google.com/search?q=" + encodeURIComponent(query);
            } else if (engine === "bing") {
                url = "https://www.bing.com/search?q=" + encodeURIComponent(query);
            } else if (engine === "duckduckgo") {
                url = "https://duckduckgo.com/?q=" + encodeURIComponent(query);
            } else if (engine === "wikipedia") {
                url = "https://en.wikipedia.org/wiki/Special:Search?search=" + encodeURIComponent(query);
            }

            if (window.sysContext) {
                sysContext.launchAppTab("web_browser_" + Date.now(), url, "Search: " + query);
            }
            queryInput.value = "";
        }

        // 4. Rotating Quotes
        function initializeQuote() {
            const quotes = [
                "\"Focus on being productive instead of busy.\"",
                "\"One way to keep momentum going is to have constantly greater goals.\"",
                "\"The secret of getting ahead is getting started.\"",
                "\"Your mind is for having ideas, not holding them.\"",
                "\"Simplicity is the ultimate sophistication.\"",
                "\"Do not let what you cannot do interfere with what you can do.\""
            ];
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById("quote-text").textContent = randomQuote;
        }

        // 5. Panel Widgets Controls
        function toggleWidget(id) {
            const target = document.getElementById(id);
            const allPanels = document.querySelectorAll(".translucent-panel");
            const isHidden = target.classList.contains("hidden");
            
            allPanels.forEach(panel => panel.classList.add("hidden"));
            if (isHidden) {
                target.classList.remove("hidden");
            }
        }

        // 6. Host IPC Bridge Link
        function initializeAnodyneIPCBridge() {
            if (typeof qt !== 'undefined' && qt.webChannelTransport) {
                new QWebChannel(qt.webChannelTransport, function(channel) {
                    window.sysContext = channel.objects.sysContext;
                    sysContext.logWebEvent("Dashboard UI successfully integrated with Hard Layer.");

                    sysContext.nativeJobProgressChanged.connect(function(jobId, progress) {
                        updateVisualTaskBar(jobId, progress);
                    });

                    sysContext.nativeJobFinished.connect(function(jobId, success, message) {
                        completeVisualTaskBar(jobId, message);
                    });
                });
            } else if (window.sysContext) {
                sysContext.logWebEvent("Dashboard UI successfully integrated with Android Hard Layer.");
                
                window.onNativeJobProgressChanged = function(jobId, progress) {
                    updateVisualTaskBar(jobId, progress);
                };
                window.onNativeJobFinished = function(jobId, success, message) {
                    completeVisualTaskBar(jobId, message);
                };

                if (typeof sysContext.getGpsLocation === 'function') {
                    const loc = sysContext.getGpsLocation();
                    window.updateDashboardGpsLocation(loc);
                }
            }
        }

        window.updateDashboardGpsLocation = function(placeString) {
            const el = document.getElementById("gps-place-text");
            if (el) el.textContent = placeString;
        };

        // Telemetry visual updates
        function updateVisualTaskBar(jobId, progress) {
            document.getElementById("task-panel").classList.remove("hidden");
            document.getElementById("no-tasks-msg").classList.add("hidden");
            
            const container = document.getElementById("active-task-container");
            container.classList.remove("hidden");

            document.getElementById("task-id").textContent = "ID: " + jobId;
            document.getElementById("task-percentage").textContent = progress + "% Processing...";
            document.getElementById("task-progress-fill").style.width = progress + "%";
        }

        function completeVisualTaskBar(jobId, statusMessage) {
            document.getElementById("task-percentage").textContent = "✓ Finished successfully.";
            document.getElementById("task-progress-fill").style.width = "100%";
            document.getElementById("task-progress-fill").style.backgroundColor = "#4caf50";

            setTimeout(function() {
                document.getElementById("active-task-container").classList.add("hidden");
                document.getElementById("no-tasks-msg").classList.remove("hidden");
                
                document.getElementById("task-progress-fill").style.width = "0%";
                document.getElementById("task-progress-fill").style.backgroundColor = "#3584e4";
            }, 3000);
        }

        // Mock RSS data
        const mockRssData = [
            { title: "Anodyne OS Stable Synthesized", desc: "Our secure, web-first immutable appliance OS is now live with SysV init, zRAM compressed swap, and dm-verity verification hooks." },
            { title: "Gnome Style Preferences Added", desc: "Unified control panel and File Viewer structured cleanly into sidebar layouts matching Gnome desktop configurations." },
            { title: "TPM LUKS Encryption Configured", desc: "Headless installation auto partition mappings successfully binding writable user spaces to Trusted Platform Modules." }
        ];

        function renderRssFeed() {
            const list = document.getElementById("rss-items-list");
            list.innerHTML = "";
            mockRssData.forEach(item => {
                const div = document.createElement("div");
                div.className = "rss-item";
                div.innerHTML = `
                    <div class="rss-title">${item.title}</div>
                    <div class="rss-desc">${item.desc}</div>
                `;
                list.appendChild(div);
            });
        }
    </script>
</body>
</html>
